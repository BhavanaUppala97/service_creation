
name: Terraform Azure Data Factory - Plan and Approve

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-adf-dev
  cancel-in-progress: false

jobs:
  plan:
    name: 1 - Terraform Plan (review changes)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout GitHub Code
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Check required repository variables
        shell: bash
        env:
          STATE_RG: ${{ vars.TF_STATE_RG }}
          STATE_STORAGE: ${{ vars.TF_STATE_STORAGE }}
        run: |
          for name in ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID STATE_RG STATE_STORAGE; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing"
              exit 1
            fi
          done
          echo "All required repository variables are configured."

      # Diagnose the exact claims GitHub sends to Azure
      - name: Inspect GitHub OIDC Claims
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.request
          import urllib.parse

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          request_token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

          query = urllib.parse.urlencode({
              "audience": "api://AzureADTokenExchange"
          })

          separator = "&" if "?" in url else "?"

          request = urllib.request.Request(
              url + separator + query,
              headers={
                  "Authorization": f"Bearer {request_token}"
              }
          )

          with urllib.request.urlopen(request) as response:
              jwt = json.load(response)["value"]

          encoded = jwt.split(".")[1]
          encoded += "=" * (-len(encoded) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(encoded)
          )

          for key in [
              "iss",
              "sub",
              "aud",
              "repository_id",
              "repository_owner_id"
          ]:
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Azure Login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Verify Azure Connection
        run: |
          az account show \
            --query "{Name:name,Subscription:id,Tenant:tenantId}" \
            --output table

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=adf-dev.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Show plan for review
        run: |
          terraform show -no-color tfplan
          echo "### Terraform plan completed" >> "$GITHUB_STEP_SUMMARY"
          echo "Review the Terraform Plan logs before approving deployment." >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: 2 - Approval required, then deploy
    needs: plan
    runs-on: ubuntu-latest
    environment: adf-dev-approval

    defaults:
      run:
        working-directory: terraform

    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Azure Login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=adf-dev.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

      - name: Final Terraform Plan
        run: terraform plan -input=false -no-color -out=approved.tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve approved.tfplan

      - name: Show Terraform Outputs
        run: terraform output
