name: Terraform Azure Data Factory CI-CD

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/deploy-adf.yml"
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/deploy-adf.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-adf-dev
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform Deploy ADF
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout GitHub Code
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      
      - name: Diagnose Azure OIDC Configuration
        shell: bash
        env:
          ACTUAL_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ACTUAL_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ACTUAL_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          EXPECTED_CLIENT_ID="3da296bf-f742-4da9-a6b4-2bd65582682f"
          EXPECTED_TENANT_ID="0fd1fc08-f43d-4c1b-bd0f-17a9128a60a4"
          EXPECTED_SUBSCRIPTION_ID="64e08ab2-3ae0-4176-ba12-0e7316f43c1e"

          test "$ACTUAL_CLIENT_ID" = "$EXPECTED_CLIENT_ID" || {
            echo "::error::Client ID mismatch"
            exit 1
          }

          test "$ACTUAL_TENANT_ID" = "$EXPECTED_TENANT_ID" || {
            echo "::error::Tenant ID mismatch"
            exit 1
          }

          test "$ACTUAL_SUBSCRIPTION_ID" = "$EXPECTED_SUBSCRIPTION_ID" || {
            echo "::error::Subscription ID mismatch"
            exit 1
          }

          echo "All Azure identity values match."


      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Connection
        run: |
          az account show \
            --query "{Name:name,Subscription:id,Tenant:tenantId}" \
            --output table

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=adf-dev.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.event_name != 'pull_request'
        run: terraform apply -auto-approve tfplan
